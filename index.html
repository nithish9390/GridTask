<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridtask</title>
    <style>
        html{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        body{
            border:solid 2px black;
            margin:0;
            box-sizing: border-box;
            padding:0;
            display:grid;
            width:99vw;
            height:900px;
            grid-template-columns:repeat(5,1fr);
       /*    grid-auto-columns: 150px; */
          grid-auto-rows:100px;
          grid-template-rows:100px;
          gap:10px;

        }
        header{
            background-color:hsl(258, 38%, 50%);
            grid-column: 1/11;
            text-align: center;
            color:white;
            font-size:20px;
            border-radius: 20px;
            /* width:97vw; */
            /* margin-left:20px; */
        }

        aside{
            display:grid;
            background-color:  red;
            grid-column:4/6 ;
            grid-row:2/4;
            text-align:center;
            border-radius:20px;
            color:white;
            font-weight:bolder;
            line-height: 50px;
            font-size:20px;
            justify-content:center;
            align-items: center;

          
            
        }
        main{
            text-align:center;
            grid-column: 1/5;
            display:grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows:100px;
            grid-auto-rows: 100px;
            grid-row: 2/4;
            gap:10px;
           
           
             }
       
        .new1{
            display:grid;
            background-color:hsl(246, 75%, 52%);
            grid-column:1/3;
           grid-row:1/2;
           border-radius: 20px;
            justify-content:center;
            align-items: center;
               color:white;
                font-size:20px;
                 font-weight:bolder;
        }
        footer{
            display:grid;
            background-color:hsl(30,70%,50%);
            grid-column:1/6;
            border-radius:20px;
             justify-content:center;
            align-items: center;
               color:white;
                font-size:25px;
                 font-weight:bolder;
        }
        .new2{
            display:grid;
             background-color:hwb(177 3% 9%);
            grid-column:3/4;
            border-radius:10px;
              justify-content:center;
            align-items: center;
               color:white;
                font-size:20px;
                 font-weight:bolder;
          
        }
        .new3{
            display:grid;
            background-color: hsl(157, 74%, 50%);
            grid-column:1/2;
            border-radius:10px;
             justify-content:center;
            align-items: center;
               color:white;
                font-size:20px;
             font-weight:bolder;
           
        }
        .new4{
            display:grid;
            background-color:brown;
            grid-column:2/3;
            border-radius: 10px;
             justify-content:center;
            align-items: center;
               color:white;
                font-size:20px;
                 font-weight:bolder;
           
        }
        .new5{
            display:grid;
            background-color:hsl(258, 38%, 50%);
            grid-column: 3/4;
            border-radius:10px;
             justify-content:center;
            align-items: center;
               color:white;
                font-size:20px;
                 font-weight:bolder;
           
        }        
     
    </style>
</head>
<body>
    <header><h2>Headline</h2></header>
    <aside>Achivements</aside>
    <main><div class="new1">News 1</div>
    <div class="new2">News 2</div>
    <div class="new3">News 3</div>
    <div class="new4">News 4</div>
    <div class="new5">News 5</div></main>
    <footer>Footer</footer>
</body>
</html>
